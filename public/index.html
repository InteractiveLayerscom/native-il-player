<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Native ILPlayer</title>
  <link rel="stylesheet" href="./native-il-player.css">
  <style>
    html { background: #101114; color-scheme: dark; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; }
    main { width: min(1080px, calc(100% - 24px)); }
  </style>
</head>
<body>
  <main>
    <div id="il-player"></div>
    <script type="application/json" id="il-player-config">{"demo":true,"locale":"en","adapter":"sdk","demoAd":"super"}</script>
    <script type="module" src="./native-il-player.js"></script>
  </main>
</body>
</html>
